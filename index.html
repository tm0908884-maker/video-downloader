<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="url"] {
      flex: 1;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="url"]:focus {
      border-color: #38bdf8;
    }
    button {
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 12px 16px;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-paste {
      background-color: #475569;
      color: #fff;
      white-space: nowrap;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #fff;
      width: 100%;
    }
    .samples {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .sample-btn {
      background: #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .sample-btn:active {
      color: #fff;
    }
    .form-group {
      margin-top: 16px;
      display: none;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 12px;
      background: #000;
      max-height: 220px;
      display: none;
    }
    .progress-box {
      margin-top: 16px;
      display: none;
    }
    .progress-bar-bg {
      background: #334155;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar-fill {
      background: #38bdf8;
      height: 100%;
      width: 0%;
      transition: width 0.2s;
    }
    .error-msg {
      margin-top: 14px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Link Input & Paste Button -->

      <button class="btn-paste" id="pasteBtn" type="button">Paste</button>

    <div class="samples">

      <button class="sample-btn" type="button" onclick="loadSample('1080p')">1080p Sample</button>
      <button class="sample-btn" type="button" onclick="loadSample('720p')">720p Sample</button>
    </div>

    <!-- Analyze Button -->
    <button class="btn-primary" id="analyzeBtn" type="button">Analyze Link</button>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg"></div>
